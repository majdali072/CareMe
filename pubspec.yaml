name: careme
description: CareMe - Healthcare Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  http: ^1.2.0
  file_picker: ^8.0.0
  http_parser: ^4.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/CareMe-Logo.png
    - assets/Google_Logo.webp
