name: careme
description: CareMe - Healthcare Management App
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  http: ^1.2.0
  file_picker: ^8.0.0
  http_parser: ^4.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  flutter_markdown: ^0.7.4
  shared_preferences: ^2.2.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/CareMe_Logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/CareMe_Logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/CareMe_Logo.png
    - assets/Google_Logo.webp
